spring.application.name=backend

spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

# Hibernate creates and updates the tables from the entities (no migration tool yet).
spring.jpa.hibernate.ddl-auto=update

# JWT signing secret. Required: set TOKEN_SECRET in .env.
api.security.token.secret=${TOKEN_SECRET}
api.security.token.issuer=tarefinhas-backend
api.security.token.expiration.hours=24
# Secure flag of the token cookie. Chrome and Firefox accept it on http://localhost.
api.security.cookie.secure=${COOKIE_SECURE:true}

# Comma-separated origins allowed to call the API (the Vite dev server by default).
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
